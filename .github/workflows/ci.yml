name: web-ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and check that the server starts and answers
        run: |
          docker build -t irieltor-web .
          docker run -d --name web -p 4000:4000 irieltor-web
          for i in $(seq 1 30); do
            curl -fs http://localhost:4000/healthz && break
            sleep 1
          done
          curl -fs http://localhost:4000/robots.txt | grep -q Sitemap
          curl -fsI http://localhost:4000/biz-haqida | grep -qi content-security-policy
