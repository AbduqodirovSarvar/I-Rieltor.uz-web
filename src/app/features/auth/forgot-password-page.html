<div class="container narrow">
  <h1>{{ 'auth.forgot.title' | t }}</h1>
  <p class="muted">{{ 'auth.forgot.intro' | t }}</p>

  <form class="card card-body stack" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-field controlId="fp-email" [label]="'auth.signUp.email' | t" [error]="error()">
      <input
        id="fp-email"
        class="input"
        type="email"
        formControlName="email"
        autocomplete="email"
        autocapitalize="none"
        spellcheck="false"
        [attr.aria-invalid]="error() ? 'true' : null"
        aria-describedby="fp-email-error"
      />
    </app-field>

    @if (sent()) {
      <p class="notice notice-success" role="status">{{ 'auth.forgot.sent' | t }}</p>
    }
    @if (wait() > 0 && !sent()) {
      <p class="notice notice-warning" role="alert">
        {{ 'auth.signIn.wait' | t: { seconds: wait() } }}
      </p>
    }

    <button type="submit" class="btn btn-block" [disabled]="!canSubmit()">
      {{ 'auth.forgot.submit' | t }}
    </button>
  </form>

  <app-eimzo-reset class="eimzo" />

  <p class="alt">
    <a [routerLink]="'/kirish' | link">{{ 'auth.forgot.back' | t }}</a>
  </p>
</div>
