<header class="header">
  <div class="container bar">
    <a class="logo" [routerLink]="'/' | link"
      ><span class="mark" aria-hidden="true">iR</span
      ><span>{{ 'site.name' | t }}<span class="tld">.uz</span></span></a
    >

    <button
      type="button"
      class="icon-btn burger"
      [attr.aria-label]="(menuOpen() ? 'nav.closeMenu' : 'nav.menu') | t"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-nav"
      (click)="toggleMenu()"
    >
      <span aria-hidden="true">{{ menuOpen() ? '✕' : '☰' }}</span>
    </button>

    <div class="panel" id="main-nav" [class.open]="menuOpen()">
      <nav class="nav" [attr.aria-label]="'nav.main' | t">
        @for (link of links; track link.path) {
          <a
            [routerLink]="link.path | link"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: link.exact }"
            >{{ link.text | t }}</a
          >
        }
      </nav>

      <div class="tools">
        <span class="lang">
          <select
            #language
            class="lang-select"
            [attr.aria-label]="'nav.language' | t"
            (change)="changeLanguage(language)"
          >
            @for (item of languages(); track item.code) {
              <option [value]="item.href" [selected]="item.selected" [attr.lang]="item.code">
                {{ item.name }}
              </option>
            }
          </select>
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
        </span>
        <button
          type="button"
          class="icon-btn theme"
          [attr.aria-label]="('theme.label' | t) + ': ' + (themeKey() | t)"
          (click)="theme.next()"
        >
          @if (theme.mode() === 'dark') {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"
              />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          }
        </button>

        @if (hydrated.ready()) {
          @if (auth.isAuthenticated()) {
            <a class="user" [routerLink]="'/kabinet' | link" [attr.aria-label]="'nav.cabinet' | t">
              <span class="avatar" aria-hidden="true">{{ initials() }}</span>
              <span class="name">{{ auth.displayName() }}</span>
            </a>
            <button type="button" class="btn btn-ghost out" (click)="signOut()">
              {{ 'nav.signOut' | t }}
            </button>
          } @else {
            <a class="btn sign-in" [routerLink]="'/kirish' | link">{{ 'nav.signIn' | t }}</a>
          }
        }
      </div>
    </div>
  </div>
</header>
