<div class="field">
  <label [attr.for]="controlId()">{{ label() }}</label>
  <div class="wrap">
    <input
      class="input"
      [id]="controlId()"
      [type]="shown() ? 'text' : 'password'"
      [formControl]="control()"
      [attr.autocomplete]="autocomplete()"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      autocapitalize="none"
      spellcheck="false"
    />
    <button
      type="button"
      class="toggle"
      [attr.aria-label]="(shown() ? 'auth.hide' : 'auth.show') | t"
      [attr.title]="(shown() ? 'auth.hide' : 'auth.show') | t"
      [attr.aria-pressed]="shown()"
      (click)="shown.set(!shown())"
    >
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
        <g
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
          <circle cx="12" cy="12" r="3" />
          @if (shown()) {
            <path d="M4 4l16 16" />
          }
        </g>
      </svg>
    </button>
  </div>
  @if (hint()) {
    <span class="hint" [id]="controlId() + '-hint'">{{ hint() }}</span>
  }
  @if (error(); as message) {
    <span class="error" [id]="controlId() + '-error'" role="alert">{{ message }}</span>
  }
</div>
