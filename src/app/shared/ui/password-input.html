<div class="field">
  <label [attr.for]="controlId()">{{ label() }}</label>
  <div class="wrap">
    <input
      class="input"
      [id]="controlId()"
      [type]="shown() ? 'text' : 'password'"
      [formControl]="control()"
      [attr.autocomplete]="autocomplete()"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      autocapitalize="none"
      spellcheck="false"
    />
    <button
      type="button"
      class="btn btn-ghost toggle"
      [attr.aria-pressed]="shown()"
      (click)="shown.set(!shown())"
    >
      {{ (shown() ? 'auth.hide' : 'auth.show') | t }}
    </button>
  </div>
  @if (hint()) {
    <span class="hint" [id]="controlId() + '-hint'">{{ hint() }}</span>
  }
  @if (error(); as message) {
    <span class="error" [id]="controlId() + '-error'" role="alert">{{ message }}</span>
  }
</div>
