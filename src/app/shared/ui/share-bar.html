<div class="row" role="group" [attr.aria-label]="'share.title' | t">
  <button type="button" class="btn btn-light" (click)="copy()">{{ 'share.copy' | t }}</button>
  <a class="btn btn-light" [href]="links().telegram" target="_blank" rel="noopener noreferrer">{{
    'share.telegram' | t
  }}</a>
  <a class="btn btn-light" [href]="links().whatsapp" target="_blank" rel="noopener noreferrer">{{
    'share.whatsapp' | t
  }}</a>
</div>
