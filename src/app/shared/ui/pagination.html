@if (pages() > 1) {
  <nav class="pagination" [attr.aria-label]="'pagination.label' | t">
    @if (page() > 1) {
      <a
        class="pg arrow"
        [routerLink]="[]"
        [queryParams]="query(page() - 1)"
        queryParamsHandling="merge"
        rel="prev"
        ><span aria-hidden="true">‹</span
        ><span class="visually-hidden">{{ 'common.previous' | t }}</span></a
      >
    }
    <ul class="numbers">
      @for (n of items(); track $index) {
        <li>
          @if (n === null) {
            <span class="gap" aria-hidden="true">…</span>
          } @else if (n === page()) {
            <span
              class="pg current"
              aria-current="page"
              [attr.aria-label]="'pagination.current' | t: { page: n }"
              >{{ n }}</span
            >
          } @else {
            <a
              class="pg"
              [routerLink]="[]"
              [queryParams]="query(n)"
              queryParamsHandling="merge"
              [attr.aria-label]="'pagination.page' | t: { page: n }"
              >{{ n }}</a
            >
          }
        </li>
      }
    </ul>
    @if (page() < pages()) {
      <a
        class="pg arrow"
        [routerLink]="[]"
        [queryParams]="query(page() + 1)"
        queryParamsHandling="merge"
        rel="next"
        ><span aria-hidden="true">›</span
        ><span class="visually-hidden">{{ 'common.next' | t }}</span></a
      >
    }
  </nav>
}
