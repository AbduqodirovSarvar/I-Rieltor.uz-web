<div class="picker">
  @if (fake) {
    <p class="notice notice-warning">{{ 'eimzo.fake' | t }}</p>
  }

  @if (loading()) {
    <p class="muted" role="status">{{ 'eimzo.loading' | t }}</p>
  } @else if (problem(); as text) {
    <p class="notice notice-danger" role="alert">{{ text | t }}</p>
    <button type="button" class="btn btn-secondary" (click)="load()">
      {{ 'eimzo.retry' | t }}
    </button>
  } @else if (keys().length > 0) {
    <fieldset class="keys">
      <legend>{{ 'eimzo.key' | t }}</legend>
      @for (k of keys(); track k.id) {
        <label class="key" [class.on]="k.id === key()?.id">
          <input
            type="radio"
            [name]="controlId()"
            [value]="k.id"
            [checked]="k.id === key()?.id"
            (change)="choose($event)"
          />
          <span class="text">
            <strong>{{ k.owner }}</strong>
            <span class="meta"
              >{{ k.organisation ? k.organisation : ''
              }}{{ k.organisation && k.validTo ? ' · ' : ''
              }}{{ k.validTo ? ('eimzo.until' | t: { date: k.validTo }) : '' }}</span
            >
          </span>
        </label>
      }
    </fieldset>
  }
</div>
