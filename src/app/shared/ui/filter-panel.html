<section class="panel card">
  <button
    type="button"
    class="btn btn-secondary toggle"
    [attr.aria-expanded]="open()"
    aria-controls="filter-body"
    (click)="open.set(!open())"
  >
    {{ title() }}
    @if (active() > 0) {
      <span class="badge badge-info">{{ active() }}</span>
    }
  </button>
  <div class="card-body body" id="filter-body" [class.open]="open()">
    <ng-content />
    @if (active() > 0) {
      <button type="button" class="btn btn-ghost" (click)="clear.emit()">
        {{ 'common.clear' | t }}
      </button>
    }
  </div>
</section>
