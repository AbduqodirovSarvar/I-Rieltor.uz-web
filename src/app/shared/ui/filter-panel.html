<section class="panel card">
  <button
    type="button"
    class="btn btn-secondary toggle"
    [attr.aria-expanded]="open()"
    aria-controls="filter-body"
    (click)="open.set(!open())"
  >
    {{ title() }}
    @if (active() > 0) {
      <span class="badge badge-info">{{ active() }}</span>
    }
  </button>
  <div class="body" id="filter-body" [class.open]="open()">
    <div class="head">
      <h2 class="title">{{ title() }}</h2>
      @if (active() > 0) {
        <button type="button" class="clear" (click)="clear.emit()">
          {{ 'common.clear' | t }}
        </button>
      }
    </div>
    <ng-content />
  </div>
</section>
